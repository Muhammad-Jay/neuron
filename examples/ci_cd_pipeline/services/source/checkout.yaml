apiVersion: neuron/v1
kind: Service

metadata:
  name: checkout
  version: 1.0.0
  description: Checkout source code from git

spec:
  executor:
    type: command

  config:
    command: git
    args:
      - clone
      - --branch
      - ${git.branch}
      - ${git.repo}
      - /workspace

  mappings:
    - name: repo-url
      direction: input
      source: execution.input.repo
      target: repo
      expression: "input.repo || '${git.repo}'"
    - name: branch
      direction: input
      source: execution.input.branch
      target: branch
      expression: "input.branch || '${git.branch}'"
    - name: workspace-output
      direction: output
      source: result
      target: workspace
      expression: "/workspace"

  validation:
    input:
      type: object
    output:
      type: object
      properties:
        workspace:
          type: string
        commit_sha:
          type: string

  execution:
    mode: wait
    timeout: 60s
    retries: 1