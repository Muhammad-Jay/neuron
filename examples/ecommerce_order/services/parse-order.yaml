apiVersion: neuron/v1
kind: Service

metadata:
  name: parse-order
  version: 1.0.0
  description: Parse and normalize order data

spec:
  executor:
    type: set

  config:
    currency: USD

  mappings:
    - direction: input
      source: validation_data
      target: validation_data

  execution:
    mode: wait
    timeout: 5s
