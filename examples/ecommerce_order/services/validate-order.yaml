apiVersion: neuron/v1
kind: Service

metadata:
  name: validate-order
  version: 1.0.0
  description: Validate incoming order request

spec:
  executor:
    type: set

  config:
    status: validated
    valid: true

  mappings:
    - direction: input
      source: execution.input.order
      target: order

  execution:
    mode: wait
    timeout: 5s
