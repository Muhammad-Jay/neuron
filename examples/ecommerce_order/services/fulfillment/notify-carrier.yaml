apiVersion: neuron/v1
kind: Service

metadata:
  name: notify-carrier
  version: 1.0.0
  description: Notify carrier for pickup

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/carriers/notify
    method: POST
    headers:
      Content-Type: application/json

  mappings:
    - name: shipment-input
      direction: input
      source: shipment
      target: shipment
      expression: "source.output.shipment"
    - name: carrier-notification-output
      direction: output
      source: result
      target: carrier_notification
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - shipment
    output:
      type: object
      properties:
        pickup_scheduled:
          type: boolean
        pickup_time:
          type: string

  execution:
    mode: wait
    timeout: 10s
    retries: 2