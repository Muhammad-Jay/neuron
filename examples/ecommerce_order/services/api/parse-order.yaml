apiVersion: neuron/v1
kind: Service

metadata:
  name: parse-order
  version: 1.0.0
  description: Parse and normalize order data

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/orders/parse
    method: POST
    headers:
      Content-Type: application/json

  mappings:
    - name: validation-input
      direction: input
      source: validation_result
      target: validation_data
      expression: "source.output.validation_result"
    - name: parsed-order
      direction: output
      source: result
      target: parsed_order
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - validation_data
    output:
      type: object
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        items:
          type: array
        total:
          type: number

  execution:
    mode: wait
    timeout: 10s
    retries: 2