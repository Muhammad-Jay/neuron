apiVersion: neuron/v1
kind: Service

metadata:
  name: enrich-customer
  version: 1.0.0
  description: Enrich order with customer data

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/customers/${input.parsed_order.customer_id}
    method: GET
    headers:
      Authorization: Bearer ${env.CUSTOMER_API_TOKEN}

  mappings:
    - name: customer-id-input
      direction: input
      source: parsed_order.customer_id
      target: customer_id
      expression: "input.parsed_order.customer_id"
    - name: customer-data-output
      direction: output
      source: result
      target: customer_data
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - customer_id
    output:
      type: object
      properties:
        tier:
          type: string
        email:
          type: string
        shipping_address:
          type: object

  execution:
    mode: wait
    timeout: 10s
    retries: 2