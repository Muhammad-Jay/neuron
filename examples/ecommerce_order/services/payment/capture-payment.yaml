apiVersion: neuron/v1
kind: Service

metadata:
  name: capture-payment
  version: 1.0.0
  description: Capture authorized payment

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: https://api.stripe.com/v1/payment_intents/${input.payment_intent.id}/capture
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
      Authorization: Bearer ${env.STRIPE_SECRET_KEY}

  mappings:
    - name: payment-intent-input
      direction: input
      source: payment_intent.id
      target: payment_intent_id
      expression: "source.output.payment_intent.id"
    - name: capture-output
      direction: output
      source: result
      target: capture_result
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - payment_intent_id
    output:
      type: object
      properties:
        status:
          type: string
        amount_received:
          type: number

  execution:
    mode: wait
    timeout: 15s
    retries: 2