apiVersion: neuron/v1
kind: Service

metadata:
  name: authorize-payment
  version: 1.0.0
  description: Authorize payment with provider

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: https://api.stripe.com/v1/payment_intents
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
      Authorization: Bearer ${env.STRIPE_SECRET_KEY}

  mappings:
    - name: amount-input
      direction: input
      source: grand_total
      target: amount
      expression: "int(source.output.grand_total * 100)"
    - name: currency-input
      direction: input
      source: execution.config.currency
      target: currency
      expression: "config.currency"
    - name: customer-input
      direction: input
      source: customer_data.email
      target: customer
      expression: "source.output.customer_data.email"
    - name: payment-intent-output
      direction: output
      source: result
      target: payment_intent
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - amount
        - currency
    output:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        client_secret:
          type: string

  execution:
    mode: wait
    timeout: 15s
    retries: 2