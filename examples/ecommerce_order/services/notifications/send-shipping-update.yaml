apiVersion: neuron/v1
kind: Service

metadata:
  name: send-shipping-update
  version: 1.0.0
  description: Send shipping notification

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/emails/send
    method: POST
    headers:
      Content-Type: application/json

  mappings:
    - name: email-input
      direction: input
      source: customer_data.email
      target: to
      expression: "source.output.customer_data.email"
    - name: tracking-input
      direction: input
      source: shipment.tracking_number
      target: tracking_number
      expression: "source.output.shipment.tracking_number"
    - name: carrier-input
      direction: input
      source: shipment.carrier
      target: carrier
      expression: "source.output.shipment.carrier"
    - name: email-output
      direction: output
      source: result
      target: shipping_email
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - to
        - tracking_number
        - carrier
    output:
      type: object
      properties:
        sent:
          type: boolean
        message_id:
          type: string

  execution:
    mode: wait
    timeout: 10s
    retries: 2