apiVersion: neuron/v1
kind: Service

metadata:
  name: reserve-items
  version: 1.0.0
  description: Reserve items in inventory

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/inventory/reserve
    method: POST
    headers:
      Content-Type: application/json

  mappings:
    - name: items-input
      direction: input
      source: parsed_order.items
      target: items
      expression: "input.parsed_order.items"
    - name: reservation-output
      direction: output
      source: result
      target: reservation
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - items
    output:
      type: object
      properties:
        reservation_id:
          type: string
        status:
          type: string

  execution:
    mode: wait
    timeout: 10s
    retries: 2