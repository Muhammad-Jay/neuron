apiVersion: neuron/v1
kind: Service

metadata:
  name: check-stock
  version: 1.0.0
  description: Check inventory availability

spec:
  executor:
    type: http
    config:
      timeout: ${api.timeout}

  config:
    url: ${api.base_url}/inventory/check
    method: POST
    headers:
      Content-Type: application/json

  mappings:
    - name: items-input
      direction: input
      source: parsed_order.items
      target: items
      expression: "input.parsed_order.items"
    - name: stock-output
      direction: output
      source: result
      target: stock_status
      expression: "source.output"

  validation:
    input:
      type: object
      required:
        - items
    output:
      type: object
      properties:
        available:
          type: boolean
        items:
          type: array

  execution:
    mode: wait
    timeout: 10s
    retries: 2