apiVersion: neuron/v1
kind: System

metadata:
  name: order-processing
  version: 1.0.0
  description: Order processing pipeline

services:
  - ref: validate-order
    entry: ../../services/validate-order.yaml
  - ref: parse-order
    entry: ../../services/parse-order.yaml
  - ref: enrich-customer
    entry: ../../services/enrich-customer.yaml
  - ref: calculate-totals
    entry: ../../services/calculate-totals.yaml
  - ref: authorize-payment
    entry: ../../services/authorize-payment.yaml
  - ref: capture-payment
    entry: ../../services/capture-payment.yaml
  - ref: create-shipment
    entry: ../../services/create-shipment.yaml
  - ref: send-confirmation
    entry: ../../services/send-confirmation.yaml

connectors:
  - from: validate-order
    to: parse-order
    mappings:
      - target: validation_data
        expression: "source.output"
    validations:
      - expression: "source.output.valid == true"
        message: "Order validation failed"

  - from: parse-order
    to: enrich-customer
    mappings:
      - target: customer_id
        expression: "source.output.validation_data.order.customer_id"

  - from: enrich-customer
    to: calculate-totals
    mappings:
      - target: items
        expression: "execution.input.order.items"
      - target: tier
        expression: "source.output.customer_data.tier"
      - target: shipping_state
        expression: "source.output.customer_data.shipping_address.state"
      - target: email
        expression: "source.output.customer_data.email"

  - from: calculate-totals
    to: authorize-payment
    mappings:
      - target: amount_cents
        expression: "execution.input.order.total"
      - target: currency
        expression: "source.output.currency"
      - target: email
        expression: "source.output.email"

  - from: authorize-payment
    to: capture-payment
    mappings:
      - target: payment_intent_id
        expression: "source.output.payment_intent.id"
    validations:
      - expression: "source.output.payment_intent.status == 'requires_capture'"
        message: "Payment not authorized"

  - from: capture-payment
    to: create-shipment
    mappings:
      - target: order
        expression: "execution.input.order"
      - target: shipping_address
        expression: "execution.input.order.shipping_address"
      - target: email
        expression: "execution.input.order.customer_email"
    validations:
      - expression: "source.output.capture_result.status == 'succeeded'"
        message: "Payment capture failed"

  - from: create-shipment
    to: send-confirmation
    mappings:
      - target: tracking_number
        expression: "source.output.shipment.tracking_number"
      - target: carrier
        expression: "source.output.shipment.carrier"
      - target: email
        expression: "source.output.email"
      - target: grand_total
        expression: "execution.input.order.total"

config:
  environment: ${environment}
