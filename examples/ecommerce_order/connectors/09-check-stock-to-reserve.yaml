apiVersion: neuron/v1
kind: Connector

metadata:
  name: check-stock-to-reserve
  version: 1.0.0
  description: Stock checked, proceed to reservation

from: check-stock
to: reserve-items

mappings:
  - target: items
    expression: "input.parsed_order.items"

validations:
  - expression: "source.output.stock_status.available == true"
    message: "Insufficient stock"