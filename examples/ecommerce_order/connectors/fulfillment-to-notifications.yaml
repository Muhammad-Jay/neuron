apiVersion: neuron/v1
kind: Connector

metadata:
  name: fulfillment-to-notifications
  version: 1.0.0
  description: Flow from fulfillment to notifications

from: notify-carrier
to: send-confirmation

mappings:
  - target: to
    expression: "source.output.customer_data.email"
  - target: order
    expression: "input.parsed_order"
  - target: total
    expression: "source.output.grand_total"

validations:
  - expression: "source.output.carrier_notification.pickup_scheduled == true"
    message: "Carrier pickup not scheduled"