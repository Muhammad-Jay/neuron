apiVersion: neuron/v1
kind: Connector

metadata:
  name: validate-to-parse
  version: 1.0.0
  description: Validated request flows into order parsing

from: validate-request
to: parse-order

mappings:
  - target: validation_data
    expression: "source.output.validation_result"

validations:
  - expression: "source.output.validation_result.valid == true"
    message: "Order validation failed"