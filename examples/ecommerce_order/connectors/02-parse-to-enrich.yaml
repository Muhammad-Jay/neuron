apiVersion: neuron/v1
kind: Connector

metadata:
  name: parse-to-enrich
  version: 1.0.0
  description: Parsed order flows into customer enrichment

from: parse-order
to: enrich-customer

mappings:
  - target: customer_id
    expression: "source.output.parsed_order.customer_id"

validations:
  - expression: "source.output.parsed_order.order_id != null"
    message: "Parsed order is missing order_id"