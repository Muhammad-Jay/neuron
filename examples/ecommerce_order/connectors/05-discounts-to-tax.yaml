apiVersion: neuron/v1
kind: Connector

metadata:
  name: discounts-to-tax
  version: 1.0.0
  description: Discounted total flows into tax calculation

from: apply-discounts
to: calculate-tax

mappings:
  - target: total_after_discount
    expression: "source.output.total_after_discount"
  - target: shipping_address
    expression: "input.customer_data.shipping_address"

validations:
  - expression: "source.output.total_after_discount > 0"
    message: "Discounted total must be positive"