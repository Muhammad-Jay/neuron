apiVersion: neuron/v1
kind: Connector

metadata:
  name: confirmation-to-shipping
  version: 1.0.0
  description: Order confirmed, send shipping notification

from: send-confirmation
to: send-shipping-update

mappings:
  - target: to
    expression: "input.customer_data.email"
  - target: tracking_number
    expression: "input.shipment.tracking_number"
  - target: carrier
    expression: "input.shipment.carrier"

validations:
  - expression: "source.output.confirmation_email.sent == true"
    message: "Order confirmation not sent"