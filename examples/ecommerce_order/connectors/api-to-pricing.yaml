apiVersion: neuron/v1
kind: Connector

metadata:
  name: api-to-pricing
  version: 1.0.0
  description: Flow from API validation to pricing calculation

from: validate-request
to: calculate-subtotal

mappings:
  - target: items
    expression: "source.output.validation_result.items"
  - target: customer_tier
    expression: "source.output.customer_data.tier"

validations:
  - expression: "source.output.validation_result.valid == true"
    message: "Order validation failed"