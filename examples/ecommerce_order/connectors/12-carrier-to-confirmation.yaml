apiVersion: neuron/v1
kind: Connector

metadata:
  name: carrier-to-confirmation
  version: 1.0.0
  description: Carrier notified, send order confirmation

from: notify-carrier
to: send-confirmation

mappings:
  - target: to
    expression: "input.customer_data.email"
  - target: order
    expression: "input.parsed_order"
  - target: total
    expression: "input.grand_total"

validations:
  - expression: "source.output.carrier_notification.pickup_scheduled == true"
    message: "Carrier pickup not scheduled"